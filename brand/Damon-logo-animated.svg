<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 100 100" role="img" aria-label="Damon">
  <title>Damon</title>
  <style>
    .mascot { transform-origin: 50% 55%; }
    .eye { transform-box: fill-box; transform-origin: center; }
    @keyframes idle {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      30% { transform: translateY(-1.6px) rotate(-3.5deg) scale(1.035); }
      62% { transform: translateY(0.6px) rotate(2.2deg) scale(0.99); }
    }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(0.12); }
      96% { transform: scaleY(1); }
    }
    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      svg:hover .mascot { animation: idle 2.6s ease-in-out infinite; }
      svg:hover .eye { animation: blink 3.4s ease-in-out infinite; }
    }
  </style>
  <defs>
    <linearGradient id="grad" x1="88%" y1="8%" x2="12%" y2="96%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="42%" stop-color="#2563eb" />
      <stop offset="74%" stop-color="#3b5bdb" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <g class="mascot">
    <path d="M26 14H56C78 14 92 30 92 50C92 70 78 86 56 86H26C20 86 16 82 16 76V24C16 18 20 14 26 14Z" fill="url(#grad)" />
    <path d="M40 32H54C66 32 74 40 74 50C74 60 66 68 54 68H40C37 68 35 66 35 63V37C35 34 37 32 40 32Z" fill="#ffffff" />
    <rect class="eye" x="44" y="42" width="8" height="18" rx="4" fill="#1e40af" />
    <rect class="eye" x="58" y="42" width="8" height="18" rx="4" fill="#1e40af" />
  </g>
</svg>
